<style>
:root{--bg:#faf8f4;--surface:#fff;--sunk:#f2eee7;--fg:#22201c;--muted:#6f6a62;--faint:#9b958b;--line:#e2ddd4;
  --d1:#15696c;--d2:#a0372b;--d3:#9a6a10;--d4:#5b4a9e;--d5:#3f6b3a;--d6:#8a3a6e;--d7:#2f6a9a;--d8:#6b5a2a;--d9:#3a7a7a;--d10:#7a3a3a;
  --warn:#b3321f;--warn-soft:#fae6e2;--gold:#c99a18;--gold-soft:#f7ecc9}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
.app{height:100%;max-width:1560px;margin-inline:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
h1{font-size:20px;margin:0;font-weight:700}h1 a{color:inherit;text-decoration:none}h1 a:hover{opacity:.7}
.steps{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.steps button{font:inherit;font-size:13px;font-weight:600;padding:6px 16px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.steps button:last-child{border-right:0}.steps button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-size:14px;font-weight:600;padding:8px 16px;border:0;border-bottom:2px solid transparent;margin-bottom:-2px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--fg)}
details.panel>summary{cursor:pointer;list-style:none;font-size:15px}details.panel>summary::-webkit-details-marker{display:none}details.panel>summary::before{content:'▸ ';color:var(--muted)}details.panel[open]>summary::before{content:'▾ '}
details.panel[open]>summary{margin-bottom:6px}.group>summary b{font-size:17px}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:3fr 2fr;gap:16px}
.layout.nomap{grid-template-columns:1fr}.layout.nomap #mapwrap{display:none}.layout.nomap .side{max-width:860px;width:100%;margin-inline:auto}
.hero{padding:28px 0 8px}.hero h2{font-size:30px;margin:0 0 6px;letter-spacing:-.01em}.hero p{margin:0 0 14px;color:var(--muted);font-size:15px}
input.text.big{font-size:17px;padding:12px 16px;border-radius:6px;max-width:520px}
.region h3{font-size:17px;margin:22px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{display:block;position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--sunk);color:#fff;text-decoration:none;border:1px solid var(--line)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}.card:hover img{transform:scale(1.04)}
.card .cap{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.65));display:flex;flex-direction:column;line-height:1.35}
.card .cap b{font-size:16px}.card .cap span{font-size:12.5px;opacity:.9}
.card.trip{aspect-ratio:3/2}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:6px 0 8px}.bar i{display:block;height:100%;background:var(--d1);transition:width .3s}
.row.check{margin:4px 0}.row.check label{font-size:15px;cursor:pointer}.row.check label.done{text-decoration:line-through;color:var(--faint)}
.result{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;background:var(--bg)}.result .row{margin:6px 0 0}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;background:var(--bg)}.drop.over{border-color:var(--d1);background:var(--gold-soft)}
.photogroup{font-size:15px;margin:14px 0 2px}.photo img{cursor:zoom-in}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out}.lightbox img{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:4px}.lightbox p{color:#fff;margin:10px 0 0;font-size:14px}
.pick .steps{margin-left:auto}.pick details.group{border-top:1px solid var(--line);padding:8px 0}.pick details.group>summary{cursor:pointer;list-style:none;font-size:15px}.pick details.group>summary::before{content:'▸ ';color:var(--muted)}.pick details.group[open]>summary::before{content:'▾ '}
.ai{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.ailog{display:flex;flex-direction:column;gap:6px;margin:8px 0;max-height:320px;overflow:auto}.msg{padding:8px 12px;border-radius:10px;max-width:92%;font-size:14px;line-height:1.5;white-space:pre-wrap}.msg.user{align-self:flex-end;background:var(--fg);color:var(--bg)}.msg.assistant{align-self:flex-start;background:var(--sunk)}
textarea.text{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);flex:1;resize:vertical;min-width:160px}
.crumb{display:flex;align-items:center;gap:10px;padding:2px 0 4px;font-size:15px}.crumb a{font-weight:800;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface)}.crumb a:hover{border-color:var(--d1);color:var(--d1)}.crumb span{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line>header .eye{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;font:inherit;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;cursor:pointer}.line>header .eye[aria-pressed="false"]{background:rgba(0,0,0,.25);opacity:.75}
.line>header .fold{font-size:15px;line-height:1;padding:3px 7px;transition:transform .15s}.line>header .fold[aria-expanded=true]{transform:rotate(180deg)}
.oops{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);background:var(--fg);color:#fff;padding:10px 12px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);font-size:14px}.oops .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
/* 불러오는 중 — 짧은 선 위를 점 하나가 달린다 */
.loading{display:flex;align-items:center;gap:12px;padding:28px 4px;color:var(--muted);font-weight:600}
.ride{position:relative;width:64px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--d1) 22%,transparent)}
.ride i{position:absolute;top:50%;left:0;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff;border:3px solid var(--d1);box-sizing:border-box;animation:ride 1.1s ease-in-out infinite alternate}
@keyframes ride{to{left:calc(100% - 12px)}}@media (prefers-reduced-motion:reduce){.ride i{animation:none;left:calc(50% - 6px)}}
/* 계정 — 세 화면을 한 노선의 역으로 */
.panel.auth{max-width:440px;margin-inline:auto;padding:22px 22px 18px}
.authline{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:2px -6px 18px}
.authline::before{content:"";position:absolute;left:16.6%;right:16.6%;top:9px;height:4px;border-radius:2px;background:var(--d1)}
.authline button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 0 2px}
.authline i{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--d1);box-sizing:border-box}
.authline [aria-current=page]{color:var(--fg);font-weight:800}.authline [aria-current=page] i{background:var(--d1);box-shadow:0 0 0 4px color-mix(in srgb,var(--d1) 18%,transparent)}
.authline button:focus-visible{outline:2px solid var(--d1);outline-offset:4px;border-radius:6px}
.authlead{color:var(--muted);margin:0 0 14px}
.field{display:block;margin:0 0 12px}.field>span{display:block;font-size:14px;font-weight:700;margin-bottom:5px}.field em{font-style:normal;font-weight:500;color:var(--faint)}.field input{width:100%;box-sizing:border-box}
.panel.auth a{color:var(--d1);font-weight:600}.panel.auth .row{margin-top:4px}.btn.ghost{background:transparent}
.authnote{background:color-mix(in srgb,var(--warn) 8%,#fff);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:14px}
/* 문서 — 절마다 노선 위 역, 번호는 역 동그라미 안 */
.doc{max-width:68ch;line-height:1.75}
.doc h3{position:relative;display:flex;align-items:center;gap:12px;font-size:17px;margin:26px 0 6px}
.doc h3 i{flex:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--d1);box-sizing:border-box;font:800 12px/20px "Wanted Sans Variable",sans-serif;font-style:normal;text-align:center;color:var(--fg)}
.doc h3~p,.doc h3~ul{margin-left:13px;padding-left:27px;border-left:4px solid color-mix(in srgb,var(--d1) 30%,transparent)}
.doc h3~ul{padding-left:44px}.doc li{margin:3px 0}
/* 404 — 끊긴 노선. 이 페이지에만 큰 글자 */
.lost{padding:36px 28px 30px;max-width:640px;margin-inline:auto}
body.v2 .panel.lost h2{font-size:clamp(34px,7vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:22px 0 10px}
.lost p{color:var(--muted);max-width:44ch}
.broken{display:flex;align-items:center;max-width:420px}
.broken .stn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.broken .stn i{width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--d1);box-sizing:border-box;font:800 12px/16px sans-serif;font-style:normal;text-align:center}
.broken .stn.end i{border-color:var(--warn);color:var(--warn)}
.broken .track{flex:2;height:5px;background:var(--d1);margin:0 -2px 20px}
.broken .gap{flex:1.4;height:5px;margin:0 6px 20px 2px;background:repeating-linear-gradient(90deg,var(--d1) 0 8px,transparent 8px 16px);opacity:.45}
/* 빈 목록 — 점선 끝의 + 역 */
.panel.empty,.panel.empty p{text-align:center}.empty{padding:30px 18px}.empty h3{margin:14px 0 6px;font-size:20px}.empty p{color:var(--muted);max-width:40ch;margin:0 auto 16px}
.emptyline{display:flex;align-items:center;justify-content:center}
.emptyline i{width:90px;height:4px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.emptyline b{width:36px;height:36px;border-radius:50%;border:4px dashed var(--d1);box-sizing:border-box;display:grid;place-items:center;color:var(--d1);font-size:20px;line-height:1}
/* 탈퇴 — 경고색 선 */
.panel.danger{border-left:4px solid var(--warn)}.panel.danger h2{color:var(--warn)}
.legal{text-align:center;font-size:13px;margin:18px 0}.legal a,.credits a{color:inherit}
.legpills{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.legpills .btn{border-radius:999px}
.guidenav{position:sticky;top:0;z-index:3;display:flex;gap:6px;padding:8px 0;background:var(--bg)}.guidenav a{font-weight:700;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px}.guidenav a:hover{border-color:var(--d1);color:var(--d1)}
.guidesec{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:18px 0 4px;scroll-margin-top:56px}
.credits{margin-top:28px;font-size:12px}
/* ───── v2 「노선도」 ───── */

  --d1:#1f4fa8;--d2:#1e8c4e;--d3:#e2611c;--d4:#7a3fb0;--d5:#0f8a96;--d6:#c0306a;--gold:#f2b400;--gold-soft:#fff6d6;--warn:#c7341f;
  font-family:"Wanted Sans Variable","Wanted Sans",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-feature-settings:"tnum"}

.v2head{display:flex;align-items:center;gap:10px;padding:4px 2px 2px}.v2title{flex:1;min-width:0;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}.v2title h2,.v2title span{white-space:nowrap}

.v2menu{position:absolute;right:0;top:42px;z-index:5;width:min(440px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(28,32,38,.14);padding:8px;display:flex;flex-direction:column;gap:2px}

.line.active{box-shadow:0 0 0 2px var(--c)}.line.over{background:var(--sunk)}
.line>header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--c);color:#fff}
.line>header b{font-size:17px;font-weight:800}.line>header span{font-size:13px;opacity:.92;flex:1}.line>header .warn{color:#fff;background:var(--warn);padding:0 6px;border-radius:4px}
