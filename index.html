<style>
:root{--bg:#faf8f4;--surface:#fff;--sunk:#f2eee7;--fg:#22201c;--muted:#6f6a62;--faint:#9b958b;--line:#e2ddd4;
  --d1:#15696c;--d2:#a0372b;--d3:#9a6a10;--d4:#5b4a9e;--d5:#3f6b3a;--d6:#8a3a6e;--d7:#2f6a9a;--d8:#6b5a2a;--d9:#3a7a7a;--d10:#7a3a3a;
  --warn:#b3321f;--warn-soft:#fae6e2;--gold:#c99a18;--gold-soft:#f7ecc9}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
.app{height:100%;max-width:1560px;margin-inline:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
h1{font-size:20px;margin:0;font-weight:700}h1 a{color:inherit;text-decoration:none}h1 a:hover{opacity:.7}
.steps{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.steps button{font:inherit;font-size:13px;font-weight:600;padding:6px 16px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.steps button:last-child{border-right:0}.steps button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-size:14px;font-weight:600;padding:8px 16px;border:0;border-bottom:2px solid transparent;margin-bottom:-2px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--fg)}
details.panel>summary{cursor:pointer;list-style:none;font-size:15px}details.panel>summary::-webkit-details-marker{display:none}details.panel>summary::before{content:'▸ ';color:var(--muted)}details.panel[open]>summary::before{content:'▾ '}
details.panel[open]>summary{margin-bottom:6px}.group>summary b{font-size:17px}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:3fr 2fr;gap:16px}
.layout.nomap{grid-template-columns:1fr}.layout.nomap #mapwrap{display:none}.layout.nomap .side{max-width:860px;width:100%;margin-inline:auto}
.hero{padding:28px 0 8px}.hero h2{font-size:30px;margin:0 0 6px;letter-spacing:-.01em}.hero p{margin:0 0 14px;color:var(--muted);font-size:15px}
input.text.big{font-size:17px;padding:12px 16px;border-radius:6px;max-width:520px}
.region h3{font-size:17px;margin:22px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{display:block;position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--sunk);color:#fff;text-decoration:none;border:1px solid var(--line)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}.card:hover img{transform:scale(1.04)}

.card .cap b{font-size:16px}.card .cap span{font-size:12.5px;opacity:.9}
.card.trip{aspect-ratio:3/2}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin:6px 0 8px}.bar i{display:block;height:100%;background:var(--d1);transition:width .3s}
.row.check{margin:4px 0}.row.check label{font-size:15px;cursor:pointer}.row.check label.done{text-decoration:line-through;color:var(--faint)}
.result{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;background:var(--bg)}.result .row{margin:6px 0 0}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;background:var(--bg)}.drop.over{border-color:var(--d1);background:var(--gold-soft)}
.photogroup{font-size:15px;margin:14px 0 2px}.photo img{cursor:zoom-in}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out}.lightbox img{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:4px}.lightbox p{color:#fff;margin:10px 0 0;font-size:14px}
.pick .steps{margin-left:auto}.pick details.group{border-top:1px solid var(--line);padding:8px 0}.pick details.group>summary{cursor:pointer;list-style:none;font-size:15px}.pick details.group>summary::before{content:'▸ ';color:var(--muted)}.pick details.group[open]>summary::before{content:'▾ '}
.ai{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.ailog{display:flex;flex-direction:column;gap:6px;margin:8px 0;max-height:320px;overflow:auto}.msg{padding:8px 12px;border-radius:10px;max-width:92%;font-size:14px;line-height:1.5;white-space:pre-wrap}.msg.user{align-self:flex-end;background:var(--fg);color:var(--bg)}.msg.assistant{align-self:flex-start;background:var(--sunk)}
textarea.text{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);flex:1;resize:vertical;min-width:160px}
.guidenav{position:sticky;top:0;z-index:3;display:flex;gap:6px;padding:8px 0;background:var(--bg)}.guidenav a{font-weight:700;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px}.guidenav a:hover{border-color:var(--d1);color:var(--d1)}
.guidesec{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:18px 0 4px;scroll-margin-top:56px}
.credits{margin-top:28px;font-size:12px}

body.v2{--bg:#ffffff;--surface:#ffffff;--sunk:#f4f5f7;--fg:#1c2026;--muted:#565e6b;--faint:#6b7380;--line:#e3e6ea;
  --d1:#1f4fa8;--d2:#1e8c4e;--d3:#e2611c;--d4:#7a3fb0;--d5:#0f8a96;--d6:#c0306a;--gold:#f2b400;--gold-soft:#fff6d6;--warn:#c7341f;
  font-family:"Wanted Sans Variable","Wanted Sans",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-feature-settings:"tnum"}

.v2head{display:flex;align-items:center;gap:10px;padding:4px 2px 2px}.v2title{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}

.v2more{position:relative}.v2more>summary{list-style:none;cursor:pointer;font-weight:800;font-size:18px;padding:4px 12px;border:1px solid var(--line);border-radius:8px}.v2more>summary::-webkit-details-marker{display:none}
.v2menu{position:absolute;right:0;top:42px;z-index:5;width:min(440px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(28,32,38,.14);padding:8px;display:flex;flex-direction:column;gap:2px}
.v2menu>button{font:inherit;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}.v2menu>button:hover{background:var(--sunk)}
.v2menu .settings{border:0;padding:6px 10px;margin-top:4px;border-top:1px solid var(--line);border-radius:0}
.v2add{display:flex;flex-direction:column;gap:6px}.v2add .search .row{margin:0}.v2add .ai{margin-top:0;border-top:0;padding-top:0}
.v2empty{background:var(--sunk);border-radius:12px;padding:16px}.v2empty p{color:var(--fg);margin:0 0 10px}
.v2chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer}.chip:hover{border-color:var(--d1);color:var(--d1)}
.v2lines{display:flex;flex-direction:column;gap:14px}
.line{--c:var(--d1);border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.line.active{box-shadow:0 0 0 2px var(--c)}.line.over{background:var(--sunk)}
.line>header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--c);color:#fff}
.line>header b{font-size:17px;font-weight:800}.line>header span{font-size:13px;opacity:.92;flex:1}.line>header .warn{color:#fff;background:var(--warn);padding:0 6px;border-radius:4px}
.line>header .x{border:0;background:none;color:#fff;font-size:18px;cursor:pointer;opacity:.8}
.daycfgbox>summary{list-style:none;cursor:pointer;font-size:12px;font-weight:700;opacity:.9}.daycfgbox>summary::-webkit-details-marker{display:none}
.daycfgbox[open]{position:absolute;z-index:4}.daycfgbox[open]>.daycfg{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 8px 24px rgba(28,32,38,.12)}
.line ol{list-style:none;margin:0;padding:6px 14px 2px}
.line li{display:grid;grid-template-columns:52px 18px 1fr;align-items:start;column-gap:10px}
.line li{background:linear-gradient(color-mix(in srgb,var(--c) 40%,transparent),color-mix(in srgb,var(--c) 40%,transparent)) no-repeat 70px 0/4px 100%}
.line li.leg{min-height:24px;align-items:center}.line li.leg select{grid-column:3;justify-self:start;font-size:12.5px;width:auto;border-bottom:0;color:var(--faint)}
.line li.stn{padding:2px 0;cursor:grab}.line li.stn time{font-size:20px;font-weight:800;line-height:1.3;text-align:right;letter-spacing:-.02em}
.line li.stn .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:4px solid var(--c);margin-top:5px;justify-self:center}
.line .nm{font-weight:700;font-size:16px;line-height:1.35}.line .star{color:var(--gold)}
.line .meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.line .ic{border:0;background:none;cursor:pointer;color:var(--faint);font-size:15px;padding:0 3px}.line .ic:hover{color:var(--fg)}
.addhere{display:block;width:calc(100% - 28px);margin:6px 14px 12px;font:inherit;font-size:13.5px;font-weight:600;color:var(--c);background:none;border:1.5px dashed var(--c);border-radius:8px;padding:7px;cursor:pointer;opacity:.85}.addhere:hover{opacity:1}
.warnline{color:var(--warn);font-size:13.5px}
.v2rec{border:1px solid var(--line);border-radius:12px;padding:10px 14px}.v2rec>summary{cursor:pointer;font-weight:700}
.mk{display:flex;align-items:center;gap:4px;cursor:pointer}.mk i{width:8px;height:8px;border-radius:50%;background:#fff;border:1.5px solid #8a929e}.mk.w1 i{width:10px;height:10px}.mk span{font-size:11px;font-weight:600;color:#565e6b;background:rgba(255,255,255,.85);padding:0 4px;border-radius:3px;white-space:nowrap}
.st{display:flex;align-items:center;gap:5px}.st i{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--c);font:800 11px/14px "Wanted Sans Variable",sans-serif;font-style:normal;text-align:center;color:#1c2026;box-sizing:border-box}.st span{font-size:12px;font-weight:700;color:#1c2026;background:#fff;padding:1px 6px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.18);white-space:nowrap}
body.v2 #sunbox .sun{border-radius:10px}
.credits a{color:inherit}
.cover{position:relative;height:180px;color:#fff}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover .cap{position:absolute;inset:auto 0 0 0;padding:40px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7))}.cover .cap b{font-size:22px;display:block}.cover .cap span{font-size:13px;opacity:.9}
#mapwrap{position:relative;min-height:340px;display:flex;flex-direction:column;gap:8px}#map{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:4px}
#btn3d{position:absolute;top:10px;right:10px;z-index:2;background:var(--surface)}#btnsun{position:absolute;top:10px;right:52px;z-index:2;background:var(--surface)}#btnsun[aria-pressed="true"]{background:#F2B400;border-color:#F2B400}#btn3d[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
#sunbox{flex:none}#sunbox .sun{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:6px 12px;font-size:13px}#sunbox .sun .row{margin:0;gap:6px 10px}#sunbox .sun p{margin:0;font-size:12px}#sunbox .sun input[type=range]{min-width:160px}
@media (max-width:1000px){#sunbox{left:6px;right:6px;bottom:22px}}#btn3d[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sun input[type=range]{accent-color:var(--gold)}
.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.panel{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:16px}
.panel h2{font-size:18px;margin:0 0 6px}.panel p{margin:0 0 8px;color:var(--muted)}
.panel p.meta{font-size:13px;margin-bottom:4px}
.leg{color:var(--faint);font-size:12.5px;padding:4px 0 4px 64px;position:relative}.leg::before{content:'';position:absolute;left:56px;top:0;bottom:0;border-left:2px dotted var(--line)}
.stop{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;padding:6px 0}
.stop .t{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.5}
.stop .name{font-weight:600;font-size:16px;line-height:1.5}
.who{font-size:11px;font-weight:600;color:var(--d4);border:1px solid var(--d4);border-radius:10px;padding:0 6px;margin-left:4px;vertical-align:2px}
.stop .tag{font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:0 5px;margin-left:4px;vertical-align:2px}
.stop .tools{display:flex;gap:6px;margin-top:8px;align-items:center}
select.quiet{border:0;background:transparent;padding:0;color:var(--muted);font-size:13.5px;border-bottom:1px dotted var(--faint);border-radius:0;cursor:pointer}
.item{padding:10px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}.item b{display:block;font-size:15.5px;margin-bottom:2px}.item span{display:block;color:var(--fg);font-size:14px;line-height:1.65}.item span.muted{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:8px 0}
.stepper{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--bg)}

.stepper .val{padding:3px 10px;border-inline:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:600}
.btn{font:inherit;font-weight:600;padding:7px 14px;border-radius:3px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:2px 8px;font-size:12px}
.regions{gap:4px;margin-bottom:2px}.regions .btn{border-radius:12px}
.dayblocks{display:flex;flex-direction:column;gap:10px}.dayblock.over{outline:2px dashed var(--d1);outline-offset:-2px;background:var(--gold-soft)}.drag{cursor:grab}.drag:active{cursor:grabbing}.grip{color:var(--faint);font-size:11px;letter-spacing:-2px;margin-right:2px}.daycfg{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}.dayblock.active{box-shadow:0 0 0 2px var(--gold-soft)}.dayblock>summary{display:flex;align-items:center;gap:8px}.dayblock>summary .btn{margin-left:auto}

.btn.user{display:inline-flex;align-items:center;gap:6px;padding:4px 10px}.btn.user .dot{width:8px;height:8px;border-radius:50%;background:var(--d1)}
input.text{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--fg);flex:1;min-width:160px}

.muted{color:var(--muted);font-size:13px}
@media (max-width:1000px){html,body{height:auto}body{overflow:visible}.app{height:auto}.layout{display:flex;flex-direction:column}#mapwrap{height:68vh}.side{overflow:visible}.layout.nomap #mapwrap{display:none}}
